<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Calculadora de IMC</h2>
        
        <div class="input-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 70">
        </div>

        <div class="input-group">
            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">
        </div>

        <button onclick="calcularIMC()">Calcular</button>

        <p id="resultado"></p>
    </div>

    <script>
        function calcularIMC() {
            
            const inputPeso = document.getElementById('peso').value;
            const inputAltura = document.getElementById('altura').value;
            const pResultado = document.getElementById('resultado');

           
            if (inputPeso === '' || inputAltura === '') {
                pResultado.textContent = 'Por favor, preencha todos os campos!';
                pResultado.style.color = 'black';
                return;
            }

           
            const peso = parseFloat(inputPeso);
            const altura = parseFloat(inputAltura);

           
            const imc = peso / (altura * altura);

            
            let classificacao = '';
            let cor = '';

            if (imc < 18.5) {
                classificacao = 'Abaixo do peso';
                cor = 'blue';
            } else if (imc >= 18.5 && imc < 25) {
                classificacao = 'Peso normal';
                cor = 'green';
            } else if (imc >= 25 && imc < 30) {
                classificacao = 'Sobrepeso';
                cor = 'orange';
            } else {
                classificacao = 'Obesidade';
                cor = 'red';
            }

           
            pResultado.textContent = `Seu IMC é ${imc.toFixed(2)} (${classificacao})`;
            pResultado.style.color = cor;
        }
    </script>

</body>
</html>
