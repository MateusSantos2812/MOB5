<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #resultado {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Conversor de Moedas</h2>
        
        <div class="input-group">
            <label for="valor">Valor:</label>
            <input type="number" id="valor" step="0.01" placeholder="Ex: 100">
        </div>

        <div class="input-group">
            <label for="moedaOrigem">Moeda de Origem:</label>
            <select id="moedaOrigem">
                <option value="BRL">Real (BRL)</option>
                <option value="USD">Dólar (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="ARS">Peso Argentino (ARS)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="moedaDestino">Moeda de Destino:</label>
            <select id="moedaDestino">
                <option value="USD">Dólar (USD)</option>
                <option value="BRL">Real (BRL)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="ARS">Peso Argentino (ARS)</option>
            </select>
        </div>

        <button onclick="converterMoeda()">Converter</button>

        <p id="resultado"></p>
    </div>

    <script>
        function converterMoeda() {
            
            const inputValor = document.getElementById('valor').value;
            const origem = document.getElementById('moedaOrigem').value;
            const destino = document.getElementById('moedaDestino').value;
            const pResultado = document.getElementById('resultado');

           
            if (inputValor === '') {
                pResultado.textContent = 'Por favor, insira um valor!';
                return;
            }

            
            const valor = parseFloat(inputValor);

           
        
            let valorEmBRL = 0;

           
            if (origem === 'BRL') {
                valorEmBRL = valor;
            } else if (origem === 'USD') {
                valorEmBRL = valor * 5.00;
            } else if (origem === 'EUR') {
                valorEmBRL = valor * 5.50;
            } else if (origem === 'ARS') {
                valorEmBRL = valor * 0.05;
            }

            let valorFinal = 0;
            let simboloDestino = '';

            
            if (destino === 'BRL') {
                valorFinal = valorEmBRL;
                simboloDestino = 'R$';
            } else if (destino === 'USD') {
                valorFinal = valorEmBRL / 5.00;
                simboloDestino = 'US$';
            } else if (destino === 'EUR') {
                valorFinal = valorEmBRL / 5.50;
                simboloDestino = '€';
            } else if (destino === 'ARS') {
                valorFinal = valorEmBRL / 0.05;
                simboloDestino = '$ARS';
            }

          
            pResultado.textContent = `Resultado: ${simboloDestino} ${valorFinal.toFixed(2)}`;
        }
    </script>

</body>
</html>
